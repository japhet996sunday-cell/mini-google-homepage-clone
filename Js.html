<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini Google Homepage</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      display: flex;
      justify-content: flex-end;
      padding: 15px 30px;
      font-size: 14px;
    }

    header a {
      margin-left: 20px;
      color: #5f6368;
      text-decoration: none;
    }

    header a:hover {
      color: #1a73e8;
    }

    /* CENTER CONTENT */
    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .logo {
      width: 272px;
      margin-bottom: 20px;
    }

    /* SEARCH BAR */
    .search-box {
      width: 100%;
      max-width: 584px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 170px 12px 45px;
      font-size: 16px;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      outline: none;
    }

    .search-box input:focus {
      box-shadow: 0 0 6px rgba(32,33,36,0.28);
    }

    /* LEFT + ICON */
    .plus-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #5f6368;
      font-size: 16px;
    }

    /* RIGHT ICONS */
    .search-icons {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-icons i {
      font-size: 16px;
      color: #5f6368;
      cursor: pointer;
    }

    /* AI MODE */
    .ai-mode {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f1f3f4;
      padding: 5px 10px;
      border-radius: 16px;
      font-size: 13px;
      color: #1a73e8;
      cursor: pointer;
      white-space: nowrap;
    }

    /* BUTTONS */
    .buttons {
      margin-top: 20px;
    }

    .buttons button {
      padding: 8px 16px;
      margin: 0 5px;
      border: 1px solid #f8f9fa;
      background: #f8f9fa;
      cursor: pointer;
      border-radius: 4px;
    }

    .buttons button:hover {
      border: 1px solid #dadce0;
    }

.languages {
  margin-top: 1px;
  font-size: 14px;
  color: #1a0dab; /* Google blue */
  text-align: center;
  cursor: pointer;
}

.languages:hover {
  text-decoration: underline;
}

    /* FOOTER */
    footer {
      background: #f2f2f2;
      padding: 15px 30px;
      font-size: 14px;
    }

    .footer-top,
    .footer-bottom {
      display: flex;
      justify-content: space-between;
      max-width: 1000px;
      margin: auto;
      flex-wrap: wrap;
    }

    footer a {
      color: #5f6368;
      text-decoration: none;
      margin: 5px 10px;
    }

    footer a:hover {
      color: #1a73e8;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <a href="#">Gmail</a>
    <a href="#">Images</a>
  </header>

  <!-- CENTER -->
  <div class="center">
    <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" class="logo" alt="Google">

    <div class="search-box">
      <!-- LEFT + ICON -->
      <i class="fa-solid fa-plus plus-icon"></i>

      <input type="text">

      <!-- RIGHT ICONS -->
      <div class="search-icons">
        <i class="fa-solid fa-microphone"></i>
        <i class="fa-solid fa-camera"></i>

        <div class="ai-mode">
          <i class="fa-solid fa-magnifying-glass"></i>
          AI Mode
        </div>
      </div>
    </div>

    <div class="buttons">
      <button>Google Search</button>
      <button>I'm Feeling Lucky</button>
    </div>
  </div>

<p class="languages">
  Google offered in: Hausa, Igbo, Ede, Yoruba, Nigerian Pidgin
</p>

  <!-- FOOTER -->
  <footer>
    <div class="footer-top">
      <a href="#">Advertising</a>
      <a href="#">Business</a>
      <a href="#">About</a>
      <a href="#">How Search works</a>
    </div>

    <div class="footer-bottom">
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Settings</a>
    </div>
  </footer>

</body>
</html>
